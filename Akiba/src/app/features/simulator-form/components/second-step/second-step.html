<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-8 animate-fadeIn">
    <div class="flex flex-col gap-6">
        <h2 class="text-2xl font-bold text-[#070707] border-l-4 border-[#56CB4E] pl-4">Identification du Terrain</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Localisation <span class="text-red-500">*</span></label>
                <input type="text" formControlName="adresse"
                    class="w-full p-3 bg-[#F5F5F5] border-2 rounded-lg focus:border-[#56CB4E] outline-none transition-all"
                    [class.border-red-400]="submitted && form.get('adresse')?.invalid"
                    [class.border-gray-100]="!(submitted && form.get('adresse')?.invalid)"
                    placeholder="Adresse complète ou coordonnées GPS (Géocodage)">
                <app-error-message *ngIf="submitted && form.get('adresse')?.errors?.['required']"
                    message="Ce champ est requis"></app-error-message>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Superficie <span class="text-red-500">*</span></label>
                <div class="flex gap-2">
                    <input type="number" formControlName="superficie"
                        class="flex-1 p-3 bg-[#F5F5F5] border-2 rounded-lg focus:border-[#56CB4E] outline-none transition-all min-w-0"
                        [class.border-red-400]="submitted && form.get('superficie')?.invalid"
                        [class.border-gray-100]="!(submitted && form.get('superficie')?.invalid)"
                        placeholder="Superficie du terrain" min="0" step="any">
                    <select formControlName="superficie_unite" (change)="onSuperficieUniteChange()"
                        [disabled]="isReadOnly"
                        class="w-[120px] shrink-0 p-3 bg-[#F5F5F5] border-2 border-gray-100 rounded-lg focus:border-[#56CB4E] outline-none font-medium text-gray-700 disabled:opacity-60">
                        <option *ngFor="let u of superficieUnites" [value]="u.value">{{ u.label }}</option>
                    </select>
                </div>
                <app-error-message *ngIf="submitted && form.get('superficie')?.errors?.['required']"
                    message="Ce champ est requis"></app-error-message>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Statut Juridique <span class="text-red-500">*</span></label>
                <app-custom-select formControlName="statut_juridique" [options]="options.statutJuridique"
                    placeholder="Choisissez le statut juridique" [multiple]="false">
                </app-custom-select>
                <app-error-message *ngIf="submitted && form.get('statut_juridique')?.errors?.['required']"
                    message="Ce champ est requis"></app-error-message>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">État du site <span class="text-red-500">*</span></label>
                <app-custom-select formControlName="etat_du_site" [options]="options.etatSite"
                    placeholder="Identifier l'état de votre site" [multiple]="false">
                </app-custom-select>
                <app-error-message *ngIf="submitted && form.get('etat_du_site')?.errors?.['required']"
                    message="Ce champ est requis"></app-error-message>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Topographie <span class="text-red-500">*</span></label>
                <app-custom-select formControlName="topographie" [options]="options.topographie"
                    placeholder="Choisissez la topologie de votre site" [multiple]="false">
                </app-custom-select>
                <app-error-message *ngIf="submitted && form.get('topographie')?.errors?.['required']"
                    message="Ce champ est requis"></app-error-message>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Situation <span class="text-red-500">*</span></label>
                <app-custom-select formControlName="situation" [options]="options.situation"
                    placeholder="Quelle est la situation de votre site" [multiple]="false">
                </app-custom-select>
                <app-error-message *ngIf="submitted && form.get('situation')?.errors?.['required']"
                    message="Ce champ est requis"></app-error-message>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Voie existante <span class="text-red-500">*</span></label>
                <app-custom-select formControlName="voie_existante" [options]="options.voieExistante"
                    placeholder="Existe t-il une voie existante ?" [multiple]="false">
                </app-custom-select>
                <app-error-message *ngIf="submitted && form.get('voie_existante')?.errors?.['required']"
                    message="Ce champ est requis"></app-error-message>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Documents fournis</label>
                <app-custom-select formControlName="documents_fournis" [options]="options.documentsFournis"
                    placeholder="Quels documents avez-vous ?" [multiple]="true">
                </app-custom-select>
            </div>
        </div>
    </div>


    <article *ngIf="!isReadOnly" class="flex justify-between mt-12 pb-20">
        <button type="button" (click)="prevStep()"
            class="px-8 py-3 rounded-lg border-2 border-gray-200 text-gray-500 font-semibold hover:bg-gray-50 transition-all">
            Précédent
        </button>

        <button type="submit"
            class="px-8 py-3 rounded-lg bg-[#56CB4E] text-white font-semibold shadow-lg hover:shadow-xl hover:bg-[#3FAE38] transition-all transform active:scale-95">
            Suivant
        </button>
    </article>
</form>
