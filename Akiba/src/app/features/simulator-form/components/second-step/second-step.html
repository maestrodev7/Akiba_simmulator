<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-8 animate-fadeIn">   
    <div class="flex flex-col gap-6">
        <h2 class="text-2xl font-bold text-[#070707] border-l-4 border-[#56CB4E] pl-4">Identification du Terrain</h2>
        
        <div class="flex flex-col gap-2">
            <label class="font-medium text-gray-700">Budget</label>
            <input type="number" formControlName="budget_previsionnel"
                class="w-full p-3 bg-[#F5F5F5] border-2 border-gray-100 rounded-lg focus:border-[#56CB4E] outline-none transition-all" 
                placeholder="Quel est votre projet prévisionnel">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Localisation</label>
                <input type="text" formControlName="adresse"
                    class="w-full p-3 bg-[#F5F5F5] border-2 border-gray-100 rounded-lg focus:border-[#56CB4E] outline-none transition-all" 
                    placeholder="Adresse complète ou coordonnées GPS (Géocodage)">
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Superficie</label>
                <input type="number" formControlName="superficie"
                    class="w-full p-3 bg-[#F5F5F5] border-2 border-gray-100 rounded-lg focus:border-[#56CB4E] outline-none transition-all" 
                    placeholder="Entrez la superficie de votre terrain en m²">
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Statut Juridique</label>
                <app-custom-select formControlName="statut_juridique" 
                    [options]="options.statutJuridique" 
                    placeholder="Choisissez le statut juridique"
                    [multiple]="false">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">État du site</label>
                <app-custom-select formControlName="etat_du_site" 
                    [options]="options.etatSite" 
                    placeholder="Identifier l'état de votre site"
                    [multiple]="false">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Topographie</label>
                <app-custom-select formControlName="topographie" 
                    [options]="options.topographie" 
                    placeholder="Choisissez la topologie de votre site"
                    [multiple]="false">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Situation</label>
                <app-custom-select formControlName="situation" 
                    [options]="options.situation" 
                    placeholder="Quelle est la situation de votre site"
                    [multiple]="false">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Voie existante</label>
                <app-custom-select formControlName="voie_existante" 
                    [options]="options.voieExistante" 
                    placeholder="Existe t-il une voie existante ?"
                    [multiple]="false">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <!-- multi-select -->
                <label class="font-medium text-gray-700">Documents fournis</label>
                <app-custom-select formControlName="documents_fournis" 
                    [options]="options.documentsFournis" 
                    placeholder="Quels documents avez-vous ?"
                    [multiple]="true">
                </app-custom-select>
            </div>
        </div>
    </div>

    <hr class="border-gray-100 my-4">

    <div class="flex flex-col gap-6">
        <h2 class="text-2xl font-bold text-[#070707] border-l-4 border-[#56CB4E] pl-4">Définition des Produits Terrain</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col gap-2">
                <!-- multi-select -->
                <label class="font-medium text-gray-700">Choix du type de produit</label>
                <app-custom-select formControlName="type_produit" 
                    [options]="options.typeProduit" 
                    placeholder="Quelle est le choix du type de produit ?"
                    [multiple]="true">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Nature des travaux</label>
                <app-custom-select formControlName="nature_travaux" 
                    [options]="options.natureTravaux" 
                    placeholder="Quelle est la nature des travaux ?"
                    [multiple]="false">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2  md:col-span-2">
                <!-- multi-select -->
                <label class="font-medium text-gray-700">Type de construction souhaité</label>
                <app-custom-select formControlName="type_construction" 
                    [options]="options.typeConstruction" 
                    placeholder="Quel type de construction souhaitez-vous avoir?"
                    [multiple]="true">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2  md:col-span-2">
                <label class="font-medium text-gray-700">Type d'architecture</label>
                <div class="flex flex-wrap justify-around items-center gap-4 md:gap-8 bg-white">
                    <!-- Traditionnelle -->
                    <label class="flex flex-col items-center gap-3 cursor-pointer group">
                        <span class="flex gap-2 items-center font-semibold text-gray-800">
                            <div class="custom-checkbox" [class.checked]="isArchitectureSelected('traditionnelle')">
                                <div class="checkmark" *ngIf="isArchitectureSelected('traditionnelle')"></div>
                            </div>
                            Traditionnelle
                        </span>
                        <input type="checkbox" class="hidden" [checked]="isArchitectureSelected('traditionnelle')" (change)="toggleArchitecture('traditionnelle')">
                        <div class="relative w-40 h-40 rounded-xl overflow-hidden border-4 transition-all"
                             [class.border-[#5EC50A]]="isArchitectureSelected('traditionnelle')"
                             [class.border-transparent]="!isArchitectureSelected('traditionnelle')">
                            <img src="./assets/house_architecture/traditional_architecture.svg" class="w-full h-full object-cover transition-transform group-hover:scale-110" alt="traditionnelle">
                            <div class="absolute inset-0 bg-black/5 group-hover:bg-transparent transition-all"></div>
                        </div>
                    </label>

                    <!-- Moderne -->
                    <label class="flex flex-col items-center gap-3 cursor-pointer group">
                        <span class="flex gap-2 items-center font-semibold text-gray-800">
                            <div class="custom-checkbox" [class.checked]="isArchitectureSelected('moderne')">
                                <div class="checkmark" *ngIf="isArchitectureSelected('moderne')"></div>
                            </div>
                            Moderne
                        </span>
                        <input type="checkbox" class="hidden" [checked]="isArchitectureSelected('moderne')" (change)="toggleArchitecture('moderne')">
                        <div class="relative w-40 h-40 rounded-xl overflow-hidden border-4 transition-all"
                             [class.border-[#5EC50A]]="isArchitectureSelected('moderne')"
                             [class.border-transparent]="!isArchitectureSelected('moderne')">
                            <img src="./assets/house_architecture/modern_architecture.svg" class="w-full h-full object-cover transition-transform group-hover:scale-110" alt="moderne">
                            <div class="absolute inset-0 bg-black/5 group-hover:bg-transparent transition-all"></div>
                        </div>
                    </label>

                    <!-- Contemporaine -->
                    <label class="flex flex-col items-center gap-3 cursor-pointer group">
                        <span class="flex gap-2 items-center font-semibold text-gray-800">
                            <div class="custom-checkbox" [class.checked]="isArchitectureSelected('contemporaine')">
                                <div class="checkmark" *ngIf="isArchitectureSelected('contemporaine')"></div>
                            </div>
                            Contemporaine
                        </span>
                        <input type="checkbox" class="hidden" [checked]="isArchitectureSelected('contemporaine')" (change)="toggleArchitecture('contemporaine')">
                        <div class="relative w-40 h-40 rounded-xl overflow-hidden border-4 transition-all"
                             [class.border-[#5EC50A]]="isArchitectureSelected('contemporaine')"
                             [class.border-transparent]="!isArchitectureSelected('contemporaine')">
                            <img src="./assets/house_architecture/luxial_architecture.svg" class="w-full h-full object-cover transition-transform group-hover:scale-110" alt="contemporaine">
                            <div class="absolute inset-0 bg-black/5 group-hover:bg-transparent transition-all"></div>
                        </div>
                    </label>

                    <!-- Futuriste -->
                    <label class="flex flex-col items-center gap-3 cursor-pointer group">
                        <span class="flex gap-2 items-center font-semibold text-gray-800">
                            <div class="custom-checkbox" [class.checked]="isArchitectureSelected('futuriste')">
                                <div class="checkmark" *ngIf="isArchitectureSelected('futuriste')"></div>
                            </div>
                            Futuriste
                        </span>
                        <input type="checkbox" class="hidden" [checked]="isArchitectureSelected('futuriste')" (change)="toggleArchitecture('futuriste')">
                        <div class="relative w-40 h-40 rounded-xl overflow-hidden border-4 transition-all"
                             [class.border-[#5EC50A]]="isArchitectureSelected('futuriste')"
                             [class.border-transparent]="!isArchitectureSelected('futuriste')">
                            <img src="./assets/house_architecture/futurist_architecture.svg" class="w-full h-full object-cover transition-transform group-hover:scale-110" alt="futuriste">
                            <div class="absolute inset-0 bg-black/5 group-hover:bg-transparent transition-all"></div>
                        </div>
                    </label>
                </div>
            </div>

            <div class="flex flex-col gap-2  md:col-span-2">
                <!-- multi-select -->
                <label class="font-medium text-gray-700">Matériaux de construction</label>
                <app-custom-select formControlName="materiaux" 
                    [options]="options.materiaux" 
                    placeholder="Quel matériaux de construction souhaitez-vous avoir?"
                    [multiple]="true">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <!-- multi-select -->
                <label class="font-medium text-gray-700">Style de construction</label>
                <app-custom-select formControlName="style_construction" 
                    [options]="options.styleConstruction" 
                    placeholder="Quel style de construction souhaitez-vous avoir?"
                    [multiple]="true">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <!-- multi-select -->
                <label class="font-medium text-gray-700">Espace et annexe</label>
                <app-custom-select formControlName="espace_annexe" 
                    [options]="options.espaceAnnexe" 
                    placeholder="Quel espace annexe souhaitez vous ajouter?"
                    [multiple]="true">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Configuration du nombre d’étage</label>
                <input type="number" formControlName="nombre_etages"
                    class="w-full p-3 bg-[#F5F5F5] border-2 border-gray-100 rounded-lg focus:border-[#56CB4E] outline-none transition-all" 
                    placeholder="nombre d’étage souhaité">
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-gray-700">Configuration du nombre de sous sol</label>
                <input type="number" formControlName="nombre_sous_sol"
                    class="w-full p-3 bg-[#F5F5F5] border-2 border-gray-100 rounded-lg focus:border-[#56CB4E] outline-none transition-all" 
                    placeholder="nombre de sous sol souhaité">
            </div>

            <div class="flex flex-col gap-2">
                <!-- multi-select -->
                <label class="font-medium text-gray-700">Type de toiture</label>
                <app-custom-select formControlName="type_toiture" 
                    [options]="options.typeToiture" 
                    placeholder="Quel type de toiture souhaitez-vous avoir?"
                    [multiple]="true">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <!-- multi-select -->
                <label class="font-medium text-gray-700">Habillage des façades</label>
                <app-custom-select formControlName="habillage_facade" 
                    [options]="options.habillageFacade" 
                    placeholder="Quel Habillage des façades souhaitez-vous avoir?"
                    [multiple]="true">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <!-- multi-select -->
                <label class="font-medium text-gray-700">Menuiserie</label>
                <app-custom-select formControlName="menuiserie" 
                    [options]="options.menuiserie" 
                    placeholder="Quel style de menuiserie souhaitez-vous avoir?"
                    [multiple]="true">
                </app-custom-select>
            </div>

            <div class="flex flex-col gap-2">
                <!-- multi-select -->
                <label class="font-medium text-gray-700">Sécurisation des ouvertures</label>
                <app-custom-select formControlName="securisation_ouvertures" 
                    [options]="options.securisationOuvertures" 
                    placeholder="Quelle sécurisation des ouvertures souhaitez-vous avoir?"
                    [multiple]="true">
                </app-custom-select>
            </div>
        </div>
    </div>
    <article class="flex justify-between mt-12 pb-20">
        <button type="button" (click)="prev.emit()" 
                class="px-8 py-3 rounded-lg border-2 border-gray-200 text-gray-500 font-semibold hover:bg-gray-50 transition-all">
            Précédent
        </button>
        
        <button type="submit" 
                class="px-8 py-3 rounded-lg bg-[#56CB4E] text-white font-semibold shadow-lg hover:shadow-xl hover:bg-[#3FAE38] transition-all transform active:scale-95">
            Suivant
        </button>
    </article>
</form>
