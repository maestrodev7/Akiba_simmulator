<div class="w-full max-w-5xl mx-auto pb-16 animate-fadeIn">

    <ng-container *ngIf="isLoading(); else contentTemplate">
        <div class="flex flex-col items-center gap-4 py-16">
            <div class="w-12 h-12 border-4 border-[#EFE3D8] border-t-[#8D5E32] rounded-full animate-spin"></div>
            <p class="text-gray-500 font-medium">Chargement des pièces...</p>
        </div>
    </ng-container>

    <ng-template #contentTemplate>

        <div *ngIf="errorMsg()" class="mb-6 text-center text-red-500 font-medium">
            {{ errorMsg() }}
        </div>

        <!-- Grille des pièces -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-5 mb-10">
            <div *ngFor="let piece of questions; let i = index" class="flex flex-col gap-2">
                <label class="text-sm text-[#333333]">
                    Combien de {{ piece.designation }} voulez-vous ?
                </label>
                <div class="relative">
                    <input type="number" [(ngModel)]="piece.value" [disabled]="isReadOnly" min="0"
                        (change)="clampPieceValue(i)"
                        class="w-full px-4 py-3 pr-10 rounded-lg bg-[#E8E8E8] border border-transparent outline-none text-[#333333] text-base appearance-none [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none focus:border-[#B27D4B]/40 transition-all">
                    <div *ngIf="!isReadOnly" class="absolute right-3 top-1/2 -translate-y-1/2 flex flex-col">
                        <button type="button" (click)="updatePieceValue(i, 1)"
                            class="text-[#888888] hover:text-[#B27D4B] leading-none text-xs p-0.5">
                            ▲
                        </button>
                        <button type="button" (click)="updatePieceValue(i, -1)" [disabled]="piece.value <= 0"
                            class="text-[#888888] hover:text-[#B27D4B] leading-none text-xs p-0.5 disabled:opacity-30">
                            ▼
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ajouter d'autres pièces -->
        <div *ngIf="!isReadOnly" class="mb-10">
            <p class="font-semibold text-[#333333] mb-4">Ajouter d'autres pièces</p>
            <div class="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-4 items-end">
                <div class="flex flex-col gap-2">
                    <label class="text-sm text-[#333333]">Nom de la pièce</label>
                    <input type="text" [(ngModel)]="newPieceName" placeholder=""
                        class="w-full px-4 py-3 rounded-lg bg-[#E8E8E8] border border-transparent outline-none text-[#333333] focus:border-[#B27D4B]/40 transition-all">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-sm text-[#333333]">Superficie</label>
                    <input type="number" [(ngModel)]="newPieceSurface" placeholder=""
                        class="w-full px-4 py-3 rounded-lg bg-[#E8E8E8] border border-transparent outline-none text-[#333333] focus:border-[#B27D4B]/40 transition-all">
                </div>
                <button type="button" (click)="createCustomPiece()"
                    [disabled]="!newPieceName || !newPieceSurface || isCreatingPiece()"
                    class="px-6 py-3 rounded-lg bg-[#B27D4B] text-white font-semibold hover:bg-[#96693F] transition-all disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap">
                    <span *ngIf="!isCreatingPiece()">+ Ajouter</span>
                    <span *ngIf="isCreatingPiece()"
                        class="inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                </button>
            </div>
        </div>

        <!-- Gamme de finition -->
        <div *ngIf="!isReadOnly" class="mb-10">
            <p class="font-semibold text-[#333333] mb-4">Gamme de finition</p>
            <div class="flex flex-col gap-4">
                <label *ngFor="let option of standingOptions"
                    class="flex items-center justify-between cursor-pointer group">
                    <div class="flex items-center gap-3">
                        <input type="radio" name="standing" [value]="option.value"
                            [checked]="selectedStanding() === option.value"
                            (change)="onStandingChange(option.value)"
                            class="w-4 h-4 accent-[#2563EB] cursor-pointer">
                        <span class="text-[#333333]">{{ option.label }}</span>
                    </div>
                    <span class="text-[#888888] text-sm">(Prix/m2)</span>
                </label>
            </div>
        </div>

        <!-- Valider -->
        <div *ngIf="!isReadOnly" class="flex justify-center mb-8">
            <button type="button" (click)="validate()"
                [disabled]="isLoading() || questions.length === 0 || totalPieces === 0"
                class="px-20 py-3 rounded-lg bg-[#B27D4B] text-white font-semibold hover:bg-[#96693F] transition-all disabled:opacity-50 disabled:cursor-not-allowed shadow-md">
                Valider
            </button>
        </div>

        <!-- Surface totale -->
        <p class="text-center text-[#333333] text-base">
            Surface total du projet
            <span class="font-bold">{{ formattedTotalSurface }}</span>
        </p>

    </ng-template>
</div>
