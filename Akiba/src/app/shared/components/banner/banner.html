<header
    class="relative w-full sm:h-[85vh] bg-cover bg-center no-repeat flex justify-center md:justify-end items-start px-4 sm:py-4 py-12 ">
    <!-- bg-[url('/assets/image/banner.svg')]  -->
    <!-- Bottom white gradient transition -->
    <div class="w-full h-full absolute top-0 left-0">
        <img src="./assets/image/banner.svg" class="w-full h-full object-cover" alt="">
    </div>
    <div class="absolute bottom-0 left-0 w-full h-10 bg-gradient-to-t from-white to-transparent pointer-events-none">
    </div>

    <div class="w-full md:w-[60%] h-auto flex flex-col gap-4 items-center z-20">
        <h1 class="text-start text-3xl lg:text-5xl text-[#FFFFFF] font-bold">Depuis
            l’étranger, bâtissez
            au pays une maison
            qui vous ressemble, en toute sérénité.</h1>

        <p class="text-[#FFFFFF] text-2xl lg:text-3xl">Notre simulateur intelligent transforme votre idée en un projet
            maîtrisé, viable et
            prêt à construire, en 6 étapes simples.</p>

        <button routerLink="/votre-projet"
            class="p-2 rounded-lg text-[#FFFFFF] bg-[#BD7A36] border border-[#A26F45] cursor-pointer active:scale-90 transition-transform transition-duration-500 hover:bg-[#AB7442]">Démarrer
            ma simulation</button>
    </div>
</header>
