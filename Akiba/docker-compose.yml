services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akiba_ssr_app
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    # On essaye de charger un .env s'il existe (facultatif)
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - akiba_network

networks:
  akiba_network:
    driver: bridge
